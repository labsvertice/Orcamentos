name: Keep Streamlit Awake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

jobs:
  wake:
    runs-on: ubuntu-latest

    steps:
      - name: Install Selenium
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Wake Streamlit app
        env:
          STREAMLIT_URL: "https://proposta-inteligente.streamlit.app/"
        run: |
          python - <<'PY'
          import os
          import time

          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          url = os.environ["STREAMLIT_URL"]

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--window-size=1920,1080")

          driver = webdriver.Chrome(options=options)

          try:
              print(f"Abrindo: {url}")
              driver.get(url)

              time.sleep(10)

              botoes = driver.find_elements(
                  By.XPATH,
                  "//button[contains(translate(., 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'get this app back up')]"
              )

              if botoes:
                  print("App estava dormindo. Acordando...")
                  botoes[0].click()
                  time.sleep(30)
              else:
                  print("App já estava ativo.")

              print("Título:", driver.title)
              print("URL:", driver.current_url)

          finally:
              driver.quit()
          PY
