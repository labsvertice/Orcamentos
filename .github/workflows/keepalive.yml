name: Keep Streamlit Awake

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager

      - name: Wake Streamlit app
        env:
          STREAMLIT_URL: "https://vertice-orcamentos.streamlit.app/"
        run: |
          python - <<'PY'
          import os
          import time

          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          url = os.environ["STREAMLIT_URL"]

          options = Options()
          options.add_argument("--headless")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--window-size=1920,1080")

          driver = webdriver.Chrome(options=options)

          try:
              print(f"Abrindo: {url}")
              driver.get(url)

              wait = WebDriverWait(driver, 60)

              time.sleep(10)

              # Se o Streamlit estiver dormindo, procura o botão de ativação.
              botoes = driver.find_elements(
                  By.XPATH,
                  "//button[contains(., 'get this app back up') or contains(., 'wake it back up')]"
              )

              if botoes:
                  print("App estava dormindo. Clicando para acordar...")
                  botoes[0].click()
                  time.sleep(30)
              else:
                  print("App já estava ativo.")

              print("Título da página:", driver.title)
              print("URL final:", driver.current_url)

          finally:
              driver.quit()
          PY
